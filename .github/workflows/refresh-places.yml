# 매달 OpenStreetMap에서 식당·카페·술집 정보를 다시 받아 Supabase places 표를 새로 채우고, 상가(상권)정보 음식점도 다시 더해요.
# 저장소 Settings → Secrets and variables → Actions 에 SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY 가 있어야 해요.
# Actions 탭에서 'Run workflow'를 눌러 바로 돌릴 수도 있어요.
name: 식당 정보 새로고침

on:
  schedule:
    - cron: "0 18 1 * *" # 매달 2일 새벽 3시(한국 시간)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-places
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - name: osmium·xlrd 설치
        run: sudo apt-get update && sudo apt-get install -y osmium-tool python3-xlrd
      - name: 식당 정보 가져오기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash scripts/import-places.sh
      - name: 상가정보 식당 가져오기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash scripts/import-sbiz-places.sh
      - name: 인허가 폐업 식당 제외
        # 폐업 자료 요청이 실패해도 앞서 가져온 가게와 다음 맛집 갱신은 보존해요.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python3 -m pip install pyproj pydantic
          bash scripts/import-closed-places.sh
      - name: 공무원 맛집 가져오기
        env:
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash scripts/import-official-picks.sh
