# 자동 테스트: 푸시·PR마다 화면 테스트(Playwright, 바깥 서비스는 가짜), 단위 테스트(bun test, tests/*.test.js), DB 테스트(PostGIS Postgres에 모든 마이그레이션 + SQL 테스트)를 돌려요.
# 로컬에서는 `npm test`, `npm run test:unit`, `PGHOST=… PGUSER=… PGPASSWORD=… npm run test:db` 로 똑같이 돌릴 수 있어요.
name: 테스트

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: 화면 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: 단위 테스트
        run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: 실패하면 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  db:
    name: DB 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 마이그레이션과 SQL 테스트
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash tests/db/run.sh
