<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- 불러올 수 있는 스크립트를 이 사이트·jsdelivr(Supabase·글꼴)·카카오 지도·구글 지도로 묶어요. 새 외부 스크립트를 쓰면 여기에 더해야 해요 -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://dapi.kakao.com https://*.daumcdn.net https://*.kakaocdn.net https://*.kakao.com https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
	<title>오메추 - 공무원 맛집</title>
	<meta name="description" content="서울시 업무추진비 식당 방문 기록.">
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
	<link rel="stylesheet" href="css/style.css">
	<script type="module" src="js/official.js"></script>
</head>
<body>
	<nav class="tabs official-tabs">
		<a href="index.html" class="official-tab-link">메뉴 추천</a>
		<a href="official.html" class="official-tab-link active" aria-current="page">공무원 맛집</a>
		<a href="account.html" class="official-tab-link">내 계정</a>
	</nav>
	<main class="container official-page">
		<header class="official-header">
			<h1 class="headline">공무원 맛집</h1>
			<p class="official-intro">
				데이터 출처: 업무추진비 집행내역 ·
				<a class="official-source-link" href="https://data.seoul.go.kr/dataList/OA-22156/S/1/datasetView.do" target="_blank" rel="noopener">서울시 본청&nbsp;↗</a>
				<a class="official-source-link" href="https://www.ep.go.kr/www/selectJobPrtnCtWebList.do?key=666" target="_blank" rel="noopener">은평구&nbsp;↗</a>
				<a class="official-source-link" href="https://www.sdm.go.kr/admininfo/budget/openmoney.do" target="_blank" rel="noopener">서대문구&nbsp;↗</a>
				<a class="official-source-link" href="https://www.mois.go.kr/frt/bbs/type001/commonSelectBoardList.do?bbsId=BBSMSTR_000000000187" target="_blank" rel="noopener">행정안전부&nbsp;↗</a>
			</p>
		</header>

		<form id="officialSearch" class="official-search">
			<label for="officialPlace">어디에서 찾을까요?</label>
			<div class="official-search-row">
				<input type="text" id="officialPlace" name="place" placeholder="동네·역 이름 (예: 시청역)">
				<button type="submit" id="officialSearchButton" class="official-search-button">근처 찾기</button>
			</div>
			<button type="button" id="officialCurrentButton" class="official-search-button">현재 위치로 찾기</button>
			<fieldset class="choices official-filter">
				<legend>1인 가격</legend>
				<div class="options">
					<label><input type="radio" name="price" value="" checked><span>전체</span></label>
					<label><input type="radio" name="price" value="15000"><span>1.5만 원 이하</span></label>
					<label><input type="radio" name="price" value="20000"><span>2만 원 이하</span></label>
					<label><input type="radio" name="price" value="30000"><span>3만 원 이하</span></label>
				</div>
			</fieldset>
		</form>

		<section class="official-results" aria-labelledby="officialListTitle">
			<div class="official-results-heading">
				<h2 id="officialListTitle">많이 간 곳 TOP 30</h2>
				<button type="button" id="officialReset" class="text-button" hidden>TOP 30 보기</button>
			</div>
			<fieldset id="officialOrder" class="choices official-filter official-order">
				<legend>순서</legend>
				<div class="options">
					<label><input type="radio" name="order" value="visits" checked><span>많이 간 순</span></label>
					<label><input type="radio" name="order" value="lunch_visits"><span>점심에 많이 간 순</span></label>
					<label><input type="radio" name="order" value="dinner_visits"><span>저녁에 많이 간 순</span></label>
				</div>
			</fieldset>
			<p id="officialStatus" class="official-status" aria-live="polite">맛집 기록을 불러오고 있어요.</p>
			<ol id="officialList" class="official-list"></ol>
		</section>
	</main>
</body>
</html>
