<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- 불러올 수 있는 스크립트를 이 사이트·jsdelivr(Supabase·글꼴)·카카오 지도·구글 지도로 묶어요. 새 외부 스크립트를 쓰면 여기에 더해야 해요 -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://dapi.kakao.com https://*.daumcdn.net https://*.kakaocdn.net https://*.kakao.com https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
	<title>오메추 - 같이 정하기</title>
	<meta name="description" content="메뉴 후보를 링크로 공유하고 모두 먹을 수 있는 메뉴를 찾아요.">
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/vote.css?v=20261030">
	<!-- 한 표 투표에서 '먹을 수 있는 메뉴 모으기'로 바꾸며 화면 구조가 달라져서, 캐시에 남은 옛 vote.js 가 섞이지 않게 주소 끝을 바꿔요 -->
	<script type="module" src="js/vote.js?v=20261030"></script>
</head>
<body>
	<nav class="tabs official-tabs">
		<a href="index.html" class="official-tab-link">메뉴 추천</a>
		<a href="official.html" class="official-tab-link">공무원 맛집</a>
		<a href="account.html" class="official-tab-link">내 계정</a>
	</nav>
	<main class="container vote-page">
		<section id="loadingView" class="vote-card" aria-live="polite">
			<p class="placeholder">투표를 불러오고 있어요…</p>
		</section>

		<section id="createView" hidden>
			<h1 class="headline">같이 정하기</h1>
			<div class="vote-card">
				<p class="vote-label">후보 <span id="optionCount">0</span>/3</p>
				<ul id="optionChips" class="vote-chips"></ul>
				<form id="addForm" class="vote-add">
					<input type="text" id="optionInput" maxlength="30" autocomplete="off" placeholder="메뉴 이름" aria-label="후보 메뉴">
					<button type="submit" id="addButton" class="vote-add-button">추가</button>
				</form>
				<label class="vote-label" for="pollPlace">모일 곳</label>
				<div class="nearby-form vote-place">
					<input type="text" id="pollPlace" placeholder="동네·역 검색 (예: 시청역)" enterkeyhint="search" readonly>
					<button type="button" id="pollCurrentButton" class="nearby-locate" aria-label="현재 위치로 정하기" title="현재 위치로 정하기"></button>
				</div>
				<button type="button" id="createButton" class="primary vote-create" disabled>투표 만들기</button>
				<p id="createMessage" class="vote-message" aria-live="polite"></p>
			</div>
		</section>

		<section id="pollView" hidden>
			<h1 class="headline">오늘 뭐 먹을까요?</h1>
			<p id="deadline" class="vote-deadline"></p>
			<div class="vote-card">
				<p id="pollArea" class="vote-area"></p>
				<form id="answerForm" class="vote-answer" hidden>
					<fieldset>
						<legend class="vote-label">먹을 수 있는 메뉴를 모두 골라 주세요</legend>
						<div id="answerOptions" class="vote-checks"></div>
					</fieldset>
					<button type="submit" id="answerButton" class="primary vote-create">다 못 먹어요</button>
				</form>
				<div id="resultBox" hidden>
					<p id="responders" class="vote-label"></p>
					<ul id="resultList" class="vote-options" aria-label="후보"></ul>
					<p id="resultNote" class="vote-message"></p>
					<div class="vote-actions">
						<button type="button" id="editButton" class="text-button">답 고치기</button>
						<a id="restartLink" class="text-button" href="vote.html" hidden>후보 다시 정하기</a>
					</div>
				</div>
				<div id="confirmedBox" class="vote-confirmed" hidden>
					<p class="vote-label">정했어요</p>
					<p id="confirmedName" class="menu-name"></p>
					<a id="restaurantLink" class="primary vote-create vote-go" href="index.html">근처 식당 보기</a>
				</div>
				<p id="pollMessage" class="vote-message" aria-live="polite"></p>
				<div class="vote-actions">
					<button type="button" id="refreshButton" class="text-button">결과 새로고침</button>
					<button type="button" id="shareButton" class="vote-share">링크 공유하기</button>
				</div>
			</div>
		</section>

		<section id="noticeView" class="vote-card vote-notice" hidden>
			<p id="noticeText" class="vote-notice-text"></p>
			<a href="index.html" class="vote-link-button">메뉴 추천으로</a>
		</section>
	</main>
	<dialog id="placePicker" class="place-picker" aria-label="위치 찾기">
		<search class="place-picker-head">
			<form class="place-picker-form">
				<input type="search" name="q" aria-label="위치 검색" placeholder="역·동네·건물 이름" enterkeyhint="search" autocomplete="off">
				<button type="submit">검색</button>
			</form>
			<button type="button" class="place-picker-close">닫기</button>
		</search>
		<div class="place-picker-map" hidden></div>
		<p class="place-picker-message" hidden></p>
		<ol class="place-picker-results"></ol>
	</dialog>
</body>
</html>
