<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- 불러올 수 있는 스크립트를 이 사이트·jsdelivr(Supabase·글꼴)·카카오 지도·구글 지도로 묶어요. 새 외부 스크립트를 쓰면 여기에 더해야 해요 -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://dapi.kakao.com https://*.daumcdn.net https://*.kakao.com https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
	<meta name="robots" content="noindex">
	<title>오메추 - 관리자</title>
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
	<link rel="stylesheet" href="css/style.css">
	<script type="module" src="js/admin.js"></script>
</head>
<body>
	<nav class="tabs official-tabs">
		<a href="index.html" class="official-tab-link">메뉴 추천</a>
		<a href="official.html" class="official-tab-link">공무원 맛집</a>
		<a href="account.html" class="official-tab-link">내 계정</a>
	</nav>
	<main class="container admin-page">
		<p id="adminNotice" class="message error" hidden></p>

		<form id="loginForm" class="panel" hidden>
			<label>이메일 <input type="email" name="email" autocomplete="username" required></label>
			<label>비밀번호 <input type="password" name="password" autocomplete="current-password" required></label>
			<button type="submit" class="primary">로그인</button>
			<p id="loginMessage" class="message"></p>
		</form>

		<section id="manager" hidden>
			<div class="manager-top">
				<span id="whoami"></span>
				<button type="button" id="logout" class="small">로그아웃</button>
			</div>

			<form id="menuForm" class="panel">
				<h2 id="formTitle">메뉴 추가</h2>
				<label>메뉴 이름 <input type="text" name="name" maxlength="30" required placeholder="예: 김치찌개"></label>
				<fieldset class="kind-checks">
					<legend>종류</legend>
					<label><input type="checkbox" name="kinds" value="식사" checked> 식사</label>
					<label><input type="checkbox" name="kinds" value="간식"> 간식</label>
					<label><input type="checkbox" name="kinds" value="술"> 술</label>
				</fieldset>
				<label>나라
					<select name="cuisine">
						<option>한식</option>
						<option>중식</option>
						<option>일식</option>
						<option>양식</option>
						<option>아시아</option>
					</select>
				</label>
				<label>식당 검색어 (쉼표로 구분, 비우면 메뉴 이름으로 찾아요)
					<input type="text" name="search_terms" placeholder="예: 짜장, 반점, 중화">
				</label>
				<label>제외어 (쉼표로 구분, 가게 이름에서 이 말 속에 든 검색어는 안 쳐요)
					<input type="text" name="exclude_terms" placeholder="예: 커리 메뉴라면 베이커리">
				</label>
				<p id="termsPreview" class="terms-preview" aria-live="polite"></p>
				<div class="form-actions">
					<button type="submit" id="saveBtn" class="primary">추가</button>
					<button type="button" id="cancelEdit" class="secondary" hidden>취소</button>
				</div>
				<p id="formMessage" class="message"></p>
			</form>

			<section id="hidePanel" class="panel">
				<h2>가게 숨기기</h2>
				<p class="panel-help">폐업했거나 엉뚱한 가게를 숨기면 주변 식당 추천에 나오지 않아요.</p>
				<form id="placeSearch" class="search-row">
					<input type="search" name="q" aria-label="가게 이름" placeholder="가게 이름으로 찾기" required>
					<button type="submit" class="secondary">찾기</button>
				</form>
				<p id="hideMessage" class="message"></p>
				<ul id="placeResults" class="place-list"></ul>
				<h3 class="panel-subtitle">숨긴 가게 <span id="hiddenCount"></span></h3>
				<ul id="hiddenList" class="place-list"></ul>
				<p id="hiddenEmpty" class="panel-help" hidden>아직 숨긴 가게가 없어요.</p>
			</section>

			<section id="reportPanel" class="panel">
				<h2>경고 알림</h2>
				<p id="reportMessage" class="message"></p>
				<ul id="reportList" class="place-list"></ul>
				<p id="reportEmpty" class="panel-help" hidden>아직 알림이 없어요.</p>
			</section>

			<h2 class="list-title">메뉴 목록 <span id="menuCount"></span></h2>
			<input type="search" id="menuSearch" class="table-search" aria-label="메뉴 찾기" placeholder="메뉴 이름이나 검색어로 찾기">
			<div class="table-wrap">
				<table class="menu-table">
					<thead>
						<tr><th>이름</th><th>종류</th><th>나라</th><th>식당 검색어</th><th>제외어</th><th></th></tr>
					</thead>
					<tbody id="menuRows"></tbody>
				</table>
			</div>
		</section>
	</main>
</body>
</html>
